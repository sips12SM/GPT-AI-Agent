name: Collector checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Collector.ps1

  powershell-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test on PowerShell 7
        shell: pwsh
        run: ./tests/Test-Collector.ps1
